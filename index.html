
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10234f">
  <title>Hi Notification App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #08152e, #2459c4);
    }

    .app {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      border-radius: 25px;
      text-align: center;
      background: #ffffff12;
      border: 1px solid #ffffff30;
      box-shadow: 0 15px 40px #0004;
    }

    .bell {
      width: 85px;
      height: 85px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      font-size: 42px;
      border-radius: 25px;
      background: linear-gradient(135deg, #3987ff, #8055ff);
    }

    h1 {
      font-size: 25px;
      margin: 10px 0;
    }

    p {
      color: #d9e5ff;
      line-height: 1.7;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid #ffffff35;
      border-radius: 12px;
      background: #ffffff12;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #3981ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="bell">🔔</div>

    <h1>Hi Notification</h1>

    <p>
      নিচে মেসেজ লিখুন এবং বাটনে ক্লিক করুন।
      আপনার ফোনের Notification Bar-এ মেসেজ দেখাবে।
    </p>

    <input
      id="message"
      type="text"
      value="Hi"
      maxlength="200"
      placeholder="আপনার মেসেজ লিখুন"
    >

    <button id="sendBtn">
      🔔 Send Notification
    </button>

    <div id="status" role="status">
      অ্যাপ প্রস্তুত হচ্ছে...
    </div>

    <div class="hint">
      প্রথমে Chrome-এ Notification অনুমতি দিন।
    </div>
  </main>

  <script>
    const button = document.getElementById("sendBtn");
    const messageInput = document.getElementById("message");
    const statusText = document.getElementById("status");

    let swRegistration = null;

    async function setupApp() {
      if (!("serviceWorker" in navigator)) {
        statusText.textContent =
          "এই ব্রাউজারে Service Worker সমর্থিত নয়।";
        button.disabled = true;
        return;
      }

      if (!window.isSecureContext) {
        statusText.textContent =
          "HTTPS ওয়েবসাইটে অ্যাপটি খুলুন।";
        button.disabled = true;
        return;
      }

      try {
        swRegistration =
          await navigator.serviceWorker.register("./sw.js");

        await navigator.serviceWorker.ready;

        statusText.textContent =
          "অ্যাপ প্রস্তুত! Send Notification চাপুন।";
      } catch (error) {
        statusText.textContent =
          "Service Worker Error: " + error.message;
      }
    }

    button.addEventListener("click", async () => {
      const message = messageInput.value.trim();

      if (!message) {
        statusText.textContent = "আগে একটি মেসেজ লিখুন।";
        return;
      }

      if (!("Notification" in window)) {
        statusText.textContent =
          "এই ব্রাউজারে Notification সমর্থিত নয়।";
        return;
      }

      button.disabled = true;

      try {
        if (!swRegistration) {
          swRegistration = await navigator.serviceWorker.ready;
        }

        let permission = Notification.permission;

        if (permission === "default") {
          permission = await Notification.requestPermission();
        }

        if (permission !== "granted") {
          statusText.textContent =
            "Chrome Site Settings থেকে Notification Allow করুন।";
          return;
        }

        await swRegistration.showNotification("Hi Notification App", {
          body: message,
          tag: "hi-" + Date.now(),
          icon: "./icon.png",
          data: {
            url: swRegistration.scope
          }
        });

        statusText.textContent =
          "Notification পাঠানো হয়েছে: " + message;

      } catch (error) {
        statusText.textContent =
          "সমস্যা হয়েছে: " + error.message;
      } finally {
        button.disabled = false;
      }
    });

    setupApp();
  </script>
</body>
    </html>
